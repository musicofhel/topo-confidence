[Service]
# Resource cage for the experiment phase ONLY (applied via a per-instance
# drop-in; triage/scriptgen are API-bound and stay uncapped).
#
# The experiment phase executes LLM-generated recompute_*.py scripts on local
# hardware. There is NO GPU path: torch/transformers/jax/tensorflow are banned
# imports (pipeline/generate_recompute.py BANNED_IMPORTS + _validate_script),
# so generated scripts are pure numpy/scipy over cached NPZ. The realistic
# "crash my computer" vector is therefore RAM, not VRAM: there are ~2172 NPZ
# caches, the largest (math500_7b per-problem) 157MB each; a script that
# stacks/holds all of them would need ~78GB and OOM the 23GB WSL VM.
#
# cgroup v2 is active and the cpu/memory/pids controllers are delegated to the
# systemd user manager, so these limits are actually enforced for a user
# service. _run_one_experiment uses start_new_session=True, which changes the
# session but NOT the cgroup, so a runaway recompute child stays inside this
# service's cgroup and is caught by MemoryMax.
# No MemoryHigh: with swap disabled below, a monotonically-growing runaway
# livelocks in direct reclaim at MemoryHigh (slow crawl, holds ~that much RAM
# for a long time) instead of dying — verified 2026-06-14. Legit recompute
# scripts use <2GB and never approach the ceiling, so graceful throttling buys
# nothing here; we want a fast, clean kill at the hard ceiling instead.
# MemorySwapMax=0 forbids thrashing the shared 8GB swap, so when usage would
# cross MemoryMax the cgroup OOM-killer fires immediately.
MemoryMax=12G
MemorySwapMax=0
CPUQuota=1400%
Nice=10
