[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topo-confidence"
version = "0.2.0"
description = "Topological uncertainty estimation for LLM reasoning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "musicofhel" }]
keywords = ["topological-data-analysis", "persistent-homology", "llm", "uncertainty", "confidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "ripser>=0.6",
    "persim>=0.3",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
eval = [
    "datasets>=2.14",
    "human-eval",
]
langchain = [
    "langchain>=0.1",
    "langchain-community>=0.1",
]

[project.scripts]
topo-confidence = "topo_confidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["topo_confidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
