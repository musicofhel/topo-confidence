services:
  jaeger:
    image: jaegertracing/jaeger:2
    container_name: topo-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    container_name: topo-langfuse-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: topo-langfuse-clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse-ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-redis:
    image: redis:7-alpine
    container_name: topo-langfuse-redis
    ports:
      - "6380:6379"     # 6380 to avoid conflict with omniswipe redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio:latest
    container_name: topo-langfuse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9090:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: langfuse_dev
    volumes:
      - langfuse-minio-data:/data
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse:3
    container_name: topo-langfuse-worker
    command: ["node", "packages/server/dist/worker.js"]
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse_dev@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      S3_ENDPOINT: http://langfuse-minio:9000
      S3_ACCESS_KEY_ID: langfuse
      S3_SECRET_ACCESS_KEY: langfuse_dev
      S3_BUCKET_NAME: langfuse
      S3_REGION: us-east-1
      NEXTAUTH_SECRET: topo-langfuse-dev-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3100
      SALT: topo-langfuse-dev-salt
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: topo-langfuse-web
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    ports:
      - "3100:3000"     # 3100 to avoid conflict with omniswipe backend on 3000
    environment:
      <<: *langfuse-env
    restart: unless-stopped

volumes:
  langfuse-pg-data:
  langfuse-ch-data:
  langfuse-minio-data:
